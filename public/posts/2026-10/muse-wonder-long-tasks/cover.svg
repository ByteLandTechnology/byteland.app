<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><defs><linearGradient id="brand"><stop stop-color="#007aff"/><stop offset=".5" stop-color="#34c759"/><stop offset="1" stop-color="#ff3b30"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="#f7f9fc"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#172033"><title id="title">Muse Wonder: test the whole task</title><desc id="desc">Three stages connect a model result to a verified task: model, tools and checks.</desc><text x="64" y="85" font-size="22" fill="#0062cc" font-weight="700">BYTELAND · OCTOBER 2026</text><text x="64" y="168" font-size="56" font-weight="700">Muse Wonder</text><text x="64" y="226" font-size="36">Test the whole task.</text><text x="64" y="277" font-size="24" fill="#5c687b">A model score is one part of the evidence.</text><path d="M220 428H980" stroke="#ccd5e3" stroke-width="6"/><rect x="64" y="360" width="298" height="157" rx="22" fill="white" stroke="#007aff" stroke-width="3"/><text x="88" y="417" font-size="34" font-weight="700" fill="#0062cc">Model</text><text x="88" y="466" font-size="20">Generate the next step</text><rect x="452" y="360" width="298" height="157" rx="22" fill="white" stroke="#34c759" stroke-width="3"/><text x="476" y="417" font-size="34" font-weight="700" fill="#208235">Tools</text><text x="476" y="466" font-size="20">Act within the rules</text><rect x="840" y="360" width="298" height="157" rx="22" fill="white" stroke="#ff3b30" stroke-width="3"/><text x="864" y="417" font-size="34" font-weight="700" fill="#c52b24">Checks</text><text x="864" y="466" font-size="20">Verify the result</text><text x="64" y="600" font-size="23" fill="#5c687b">Release facts · benchmark limits · acceptance tests</text></g><rect y="665" width="1200" height="10" fill="url(#brand)"/></svg>