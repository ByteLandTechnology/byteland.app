<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Two independent benchmarks show different rankings</title><desc id="desc">Vals Index v2.1 reports 68.90 percent and first place for Argon. Artificial Analysis reports Intelligence Index score 53 at high effort and eighth place among 216 models. The two scores are not directly comparable.</desc><defs><linearGradient id="brand"><stop stop-color="#007aff"/><stop offset=".5" stop-color="#34c759"/><stop offset="1" stop-color="#ff3b30"/></linearGradient></defs><rect width="1200" height="660" rx="24" fill="#f7f9fc"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#172033"><text x="60" y="80" font-size="38" font-weight="700">Two benchmarks, different questions</text><text x="60" y="130" font-size="25" fill="#526176">October 14 snapshot. Scores use different scales and task sets.</text><rect x="60" y="185" width="520" height="270" rx="20" fill="white" stroke="#0062cc" stroke-width="2"/><text x="86" y="237" font-size="29" font-weight="700" fill="#0062cc">Vals Index v2.1</text><text x="86" y="302" font-size="36" font-weight="700">68.90% · rank 1</text><text x="86" y="369" font-size="25">GDP-weighted work tasks</text><text x="86" y="413" font-size="23">Finance, coding, legal and tax</text><rect x="620" y="185" width="520" height="270" rx="20" fill="white" stroke="#167737" stroke-width="2"/><text x="646" y="237" font-size="29" font-weight="700" fill="#167737">Artificial Analysis</text><text x="646" y="302" font-size="36" font-weight="700">53 · rank 8 of 216</text><text x="646" y="369" font-size="25">Intelligence Index · high effort</text><text x="646" y="413" font-size="23">Different task mix and grading</text><text x="60" y="525" font-size="28" font-weight="700">A leaderboard lead is specific to its benchmark.</text><text x="60" y="576" font-size="24" fill="#526176">Do not average these scores or treat either rank as universal quality.</text></g><rect y="652" width="1200" height="8" fill="url(#brand)"/></svg>