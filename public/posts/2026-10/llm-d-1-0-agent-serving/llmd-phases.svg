<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">llm-d: requests, routing, and inference</title><desc id="desc">Illustrative queues A and B feed a router. The router can hold work when engines are saturated. Optional priority and fairness policies select the next request. Prefill and decode can be separated with context transfer. This is not a performance measurement.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#DDE3E8"/></pattern></defs><rect width="1280" height="720" fill="#F8FAFC"/><rect width="1280" height="720" fill="url(#grid)"/><g font-family="Inter,Arial,sans-serif"><text x="80" y="74" fill="#007AFF" font-size="23" font-weight="650">llm-d 1.0</text><text x="80" y="145" fill="#17212B" font-size="47" font-weight="700">Keep context connected</text><text x="80" y="196" fill="#536371" font-size="25" font-weight="500">Prefill reads the prompt. Decode generates the response.</text><text x="112" y="251" fill="#536371" font-size="17" font-weight="650">WAITING</text><g><rect x="112" y="278" width="80" height="68" rx="16" fill="white" stroke="#007AFF" stroke-width="2"/><text x="137" y="321" fill="#007AFF" font-size="22" font-weight="650">A3</text></g><g><rect x="212" y="278" width="80" height="68" rx="16" fill="white" stroke="#007AFF" stroke-width="2"/><text x="237" y="321" fill="#007AFF" font-size="22" font-weight="650">A2</text></g><g><rect x="312" y="278" width="80" height="68" rx="16" fill="white" stroke="#007AFF" stroke-width="2"/><text x="337" y="321" fill="#007AFF" font-size="22" font-weight="650">A1</text></g><g><rect x="112" y="398" width="80" height="68" rx="16" fill="white" stroke="#34C759" stroke-width="2"/><text x="137" y="441" fill="#34C759" font-size="22" font-weight="650">B3</text></g><g><rect x="212" y="398" width="80" height="68" rx="16" fill="white" stroke="#34C759" stroke-width="2"/><text x="237" y="441" fill="#34C759" font-size="22" font-weight="650">B2</text></g><g><rect x="312" y="398" width="80" height="68" rx="16" fill="white" stroke="#34C759" stroke-width="2"/><text x="337" y="441" fill="#34C759" font-size="22" font-weight="650">B1</text></g><path d="M407 312 H456 Q480 312 480 336 H800 M407 432 H456 Q480 432 480 408 V336" fill="none" stroke="#BBC8D4" stroke-width="3"/><rect x="530" y="278" width="170" height="188" rx="28" fill="#E5F0FF" stroke="#007AFF" stroke-width="2"/><text x="563" y="330" fill="#17212B" font-size="28" font-weight="650">Router</text><circle cx="615" cy="392" r="26" fill="white" stroke="#007AFF" stroke-width="2"/><path d="M603 392 h24 m-8 -8 8 8 -8 8" fill="none" stroke="#007AFF" stroke-width="3"/><rect x="760" y="246" width="310" height="104" rx="22" fill="white" stroke="#007AFF" stroke-width="2"/><text x="790" y="295" fill="#17212B" font-size="28" font-weight="650">Prefill</text><text x="790" y="326" fill="#536371" font-size="20" font-weight="500">Process the prompt</text><g opacity="1"><path d="M915 350 V407" stroke="#007AFF" stroke-width="3"/><text x="946" y="386" fill="#536371" font-size="18" font-weight="500">context</text><circle cx="915" cy="389.2345679012346" r="5" fill="#007AFF"/><rect x="760" y="407" width="310" height="104" rx="22" fill="white" stroke="#34C759" stroke-width="2"/><text x="788" y="450" fill="#17212B" font-size="28" font-weight="650">Decode</text><text x="788" y="484" fill="#536371" font-size="20" font-weight="500">Generate tokens</text></g><circle cx="804.9518259954881" cy="336" r="9" fill="#007AFF"/><text x="112" y="565" fill="#536371" font-size="22" font-weight="500">Separate phases are an existing capability, not new in 1.0.</text><text x="80" y="655" fill="#697783" font-size="16" font-weight="600">SCHEMATIC · NOT A BENCHMARK</text></g><rect y="714" width="426.67" height="6" fill="#007AFF"/><rect x="426.67" y="714" width="426.67" height="6" fill="#34C759"/><rect x="853.34" y="714" width="426.67" height="6" fill="#FF3B30"/></svg>