<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">Hostname acceptance does not verify the destination</title><desc id="desc">The URL policy examines hostname text. DNS and the network connection are outside its check. Our test used a local fetch function and made no DNS query or connection.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#007aff"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="DejaVu Sans, sans-serif"><g transform="translate(36 24) scale(0.2625)"><path d="M 185.797 154.656 H 250.18 A 15.617 15.617 0 0 1 265.797 170.273 V 186.622 H 201.414 A 15.617 15.617 0 0 1 185.797 171.005 V 154.656 Z" fill="#FF3B30" transform="matrix(1, 0.000038000009, -0.045962005854, 0.999997913837, -168.868009190224, -54.653743213001) rotate(41 244.868 144.653)"/><path d="M 64 56.001 H 127.607 A 16.393 15.983 0 0 1 144 71.984 V 87.967 H 80.393 A 16.393 15.983 0 0 1 64 71.984 V 56.001 Z" fill="#007AFF" transform="matrix(1, -0.000035000008, 0.045961000025, 0.999997913837, -49.459615860936, 43.99966710378) rotate(161 125.461 46.001)"/><path d="M 76.541 130.588 H 140.541 A 16 16 0 0 1 156.541 146.588 V 162.588 H 92.541 A 16 16 0 0 1 76.541 146.588 V 130.588 Z" fill="#34C759" transform="matrix(1, 0.000001, -0.000001, 1, -61.540953143559, -30.587936189438) rotate(281 137.541 120.624)"/></g><text x="94" y="56" font-size="22" fill="#566174" font-weight="700" text-anchor="start">BYTELAND</text><text x="38" y="120" font-size="33" fill="#172033" font-weight="700" text-anchor="start">A hostname is not an IP address.</text><rect x="88" y="166" width="624" height="100" rx="18" fill="white" stroke="#007aff" stroke-width="3"/><text x="400.0" y="208" font-size="30" fill="#007aff" font-weight="700" text-anchor="middle">URL hostname</text><text x="400.0" y="243" font-size="22" fill="#566174" font-weight="400" text-anchor="middle">Input to the URL policy</text><text x="400" y="320" font-size="30" fill="#34c759" font-weight="700" text-anchor="middle">Hostname accepted</text><path d="M70 363H730" stroke="#cdd5df" stroke-width="2" stroke-dasharray="10 8"/><text x="400" y="413" font-size="26" fill="#566174" font-weight="700" text-anchor="middle">Outside this policy</text><rect x="88" y="449" width="624" height="100" rx="18" fill="white" stroke="#ff3b30" stroke-width="3"/><text x="400.0" y="491" font-size="30" fill="#ff3b30" font-weight="700" text-anchor="middle">DNS + network connection</text><text x="400.0" y="526" font-size="22" fill="#566174" font-weight="400" text-anchor="middle">Actual destination requires other controls</text><text x="400" y="610" font-size="28" fill="#172033" font-weight="700" text-anchor="middle">Offline result: acceptance only.</text><text x="400" y="656" font-size="28" fill="#566174" font-weight="400" text-anchor="middle">No DNS query. No connection.</text></g></svg>