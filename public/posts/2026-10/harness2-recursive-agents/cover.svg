<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Harness²: improve the agent without retraining the model</title><desc id="desc">Harness² changes prompts, tools, memory and workflow around a fixed model. Task-level refinement uses Propose, Probe and Compose. Across-task experience informs later refinements. This is a Google Research project, not an officially supported Google product.</desc><defs><linearGradient id="theme"><stop stop-color="#007aff"/><stop offset=".5" stop-color="#34c759"/><stop offset="1" stop-color="#ff3b30"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#586579" stroke-width="1.5"/></marker></defs><rect width="1200" height="630" rx="24" fill="#f7f9fc"/><text x="64" y="68" font-size="23" fill="#0062cc" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">HARNESS² · GOOGLE RESEARCH</text><text x="64" y="150" font-size="52" fill="#172033" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">Improve the agent.</text><text x="64" y="221" font-size="49" fill="#172033" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">Keep the model weights fixed.</text><rect x="64" y="291" width="274" height="174" rx="18" fill="#eef2f7" stroke="#aebbcf" stroke-width="2"/><text x="90" y="339" font-size="31" fill="#172033" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">Model</text><text x="90" y="391" font-size="24" fill="#586579" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Fixed weights</text><text x="90" y="435" font-size="22" fill="#586579" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">No retraining</text><rect x="410" y="314" width="190" height="128" rx="18" fill="white" stroke="#34c759" stroke-width="2"/><text x="430" y="365" font-size="27" fill="#208235" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">Propose</text><text x="430" y="407" font-size="18" fill="#586579" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Harness edits</text><rect x="682" y="314" width="190" height="128" rx="18" fill="white" stroke="#34c759" stroke-width="2"/><text x="702" y="365" font-size="27" fill="#208235" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">Probe</text><text x="702" y="407" font-size="18" fill="#586579" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Executions</text><rect x="954" y="314" width="190" height="128" rx="18" fill="white" stroke="#34c759" stroke-width="2"/><text x="974" y="365" font-size="27" fill="#208235" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">Compose</text><text x="974" y="407" font-size="18" fill="#586579" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Refinement</text><path d="M616 376H664" fill="none" stroke="#586579" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M888 376H936" fill="none" stroke="#586579" stroke-width="2.5" marker-end="url(#arrow)"/><text x="64" y="521" font-size="23" fill="#586579" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Two loops: refine the current task · retain experience for later tasks</text><text x="64" y="570" font-size="21" fill="#586579" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">October research release · not an officially supported Google product</text><rect y="622" width="1200" height="8" fill="url(#theme)"/></svg>