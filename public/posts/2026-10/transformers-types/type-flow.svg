<svg xmlns="http://www.w3.org/2000/svg" width="760" height="960" viewBox="0 0 760 960" role="img" aria-labelledby="title desc"><title id="title">Preserve the container interface</title><desc id="desc">The old helper loses ModelOutput type. The patch preserves it. Both carry tensors, but only the typed result supports expected attributes.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif} .body{font-size:23px;fill:#334155}.label{font-size:27px;font-weight:700;fill:#172033}</style><rect width="760" height="960" rx="24" fill="#f7f9fc"/><text x="42" y="64" class="label">Move data. Preserve behavior.</text><text x="42" y="102" class="body">Transformers 5.20.1 → 5.20.2</text><rect x="42" y="148" width="676" height="126" rx="18" fill="white" stroke="#007aff" stroke-width="3"/><text x="66" y="195" class="label">BaseModelOutput</text><text x="66" y="239" class="body">last_hidden_state → tensor</text><path d="M380 282v65m-10-12l10 12 10-12" stroke="#586579" fill="none" stroke-width="4"/><rect x="42" y="364" width="676" height="126" rx="18" fill="white" stroke="#d92820" stroke-width="3"/><text x="66" y="411" class="label">5.20.1: plain dict</text><text x="66" y="455" class="body">Same entries. Attribute access fails.</text><path d="M380 500v65m-10-12l10 12 10-12" stroke="#586579" fill="none" stroke-width="4"/><rect x="42" y="584" width="676" height="126" rx="18" fill="white" stroke="#208235" stroke-width="3"/><text x="66" y="631" class="label">5.20.2: original class</text><text x="66" y="675" class="body">ModelOutput and nested fields survive.</text><text x="42" y="780" class="label">Check the interface contract</text><text x="42" y="828" class="body">Values • shapes • devices • container types</text><text x="42" y="878" class="body">Custom constructors still need separate tests.</text></svg>