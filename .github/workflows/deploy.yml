name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Daily rebuild so blog posts dated in the future go live on their date.
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Videos are rendered from the Remotion sources in video/ (which reuse
      # the site's art and project config) and cached until those change.
      - name: Restore rendered videos
        id: videos
        uses: actions/cache@v4
        with:
          path: public/videos
          key: videos-${{ hashFiles('video/**', 'src/components/art/**', 'src/config/projects.ts', 'src/config/project-pages.ts') }}

      - name: Render videos
        if: steps.videos.outputs.cache-hit != 'true'
        working-directory: video
        run: |
          npm ci
          npx remotion browser ensure
          npm run render

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
