<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Three llm-d operating decisions</title><desc id="desc">Admission policy, destination selection and compatible rollout address different service constraints. The rollout screener is Alpha and requires configuration.</desc><rect width="100%" height="100%" fill="#f7f9fc"/><g font-family="DejaVu Sans,sans-serif" fill="#172033"><text x="48" y="60" font-size="32" fill="#172033">llm-d 1.0: three operating decisions</text><circle cx="78" cy="125" r="27" fill="#007aff"/><text x="78" y="135" text-anchor="middle" font-size="28" font-weight="700" fill="white">1</text><text x="128" y="121" font-size="28" fill="#172033">Can it enter?</text><text x="128" y="157" font-size="23" fill="#5c687b">Capacity + waiting policy</text><circle cx="78" cy="237" r="27" fill="#34c759"/><text x="78" y="247" text-anchor="middle" font-size="28" font-weight="700" fill="white">2</text><text x="128" y="233" font-size="28" fill="#172033">Where should it go?</text><text x="128" y="269" font-size="23" fill="#5c687b">Cache locality + load</text><circle cx="78" cy="349" r="27" fill="#ff3b30"/><text x="78" y="359" text-anchor="middle" font-size="28" font-weight="700" fill="white">3</text><text x="128" y="345" font-size="28" fill="#172033">Is the path ready?</text><text x="128" y="381" font-size="23" fill="#5c687b">Compatible revisions · Alpha</text><text x="48" y="465" font-size="21" fill="#5c687b">Different controls. No universal speed guarantee.</text></g></svg>