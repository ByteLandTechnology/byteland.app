<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Queue after one admission</title><desc id="desc">X1 completed. A1 occupies the serving slot. B1 waits at the front. No request is admitted before capacity is available.</desc><rect width="100%" height="100%" fill="#f7f9fc"/><g font-family="DejaVu Sans,sans-serif" fill="#172033"><text x="45" y="55" font-size="29" fill="#172033">Wait for capacity. Then admit work.</text><text x="60" y="120" font-size="25" fill="#172033">Waiting</text><text x="520" y="120" font-size="25" fill="#172033">One serving slot</text><path d="M70 210H585" stroke="#bdcbdc" stroke-width="3" fill="none"/><rect x="505" y="145" width="235" height="145" rx="21" fill="white" stroke="#bdcbdc" stroke-width="2.5"/><text x="520" y="325" font-size="22" fill="#5c687b">Completed</text><text x="45" y="440" font-size="20" fill="#5c687b">Illustration only. Policy is configured; speed is not measured.</text><g class="" transform="translate(625 365)"><rect x="-43" y="-29" width="86" height="58" rx="15" fill="white" stroke="#5c687b" stroke-width="2.5"/><text text-anchor="middle" y="10" font-size="29" font-weight="700" fill="#5c687b">X1</text></g><g class="" transform="translate(625 210)"><rect x="-43" y="-29" width="86" height="58" rx="15" fill="white" stroke="#007aff" stroke-width="2.5"/><text text-anchor="middle" y="10" font-size="29" font-weight="700" fill="#007aff">A1</text></g><g class="" transform="translate(345 210)"><rect x="-43" y="-29" width="86" height="58" rx="15" fill="white" stroke="#34c759" stroke-width="2.5"/><text text-anchor="middle" y="10" font-size="29" font-weight="700" fill="#34c759">B1</text></g></g></svg>