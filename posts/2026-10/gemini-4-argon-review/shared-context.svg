<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Gemini 4 Argon shared token window</title><desc id="desc">Input, thinking and output share 1,048,576 tokens. Default synchronous output is capped at 65,536. Long decode uses background continuation. The segment sizes are schematic, not measured. Motion stops after four seconds and is disabled for reduced motion.</desc><defs><linearGradient id="brand"><stop stop-color="#007aff"/><stop offset=".5" stop-color="#34c759"/><stop offset="1" stop-color="#ff3b30"/></linearGradient></defs><rect width="1200" height="660" rx="24" fill="#f7f9fc"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#172033"><text x="60" y="80" font-size="38" font-weight="700">One window, three uses</text><text x="60" y="130" font-size="25" fill="#526176">1,048,576 tokens total: input + thinking + output</text><rect x="60" y="190" width="1080" height="125" rx="16" fill="#e5eaf2"/>
<rect x="60" y="190" width="330" height="125" rx="16" fill="#d6e8ff"/><rect x="390" y="190" width="350" height="125" fill="#d8f1df"/><rect x="740" y="190" width="400" height="125" rx="16" fill="#ffe1dd"/>
<text x="155" y="263" font-size="32" font-weight="700" fill="#0062cc">Input</text><text x="495" y="263" font-size="32" font-weight="700" fill="#167737">Thinking</text><text x="865" y="263" font-size="32" font-weight="700" fill="#be3028">Output</text>
<path class="scan" d="M65 180V325" stroke="#172033" stroke-width="4" opacity=".6"/><style>@keyframes scan{0%,15%{transform:translateX(0)}85%,100%{transform:translateX(1070px)}}.scan{animation:scan 4s ease-in-out 1}@media(prefers-reduced-motion:reduce){.scan{animation:none;opacity:0}}</style>
<text x="60" y="375" font-size="24" fill="#526176">Schematic allocation only. Segment widths are not measurements.</text>
<rect x="60" y="420" width="510" height="138" rx="18" fill="white" stroke="#c8d3e0"/><rect x="600" y="420" width="540" height="138" rx="18" fill="white" stroke="#c8d3e0"/>
<text x="84" y="465" font-size="25" font-weight="700">Default synchronous output</text><text x="84" y="515" font-size="30" fill="#0062cc">Up to 65,536 tokens</text><text x="624" y="465" font-size="25" font-weight="700">Long decode</text><text x="624" y="510" font-size="24">Background continuation uses</text><text x="624" y="543" font-size="24">the remaining shared window.</text>
<text x="60" y="610" font-size="22" fill="#526176">Source: Google Gemini API documentation · checked October 14, 2026</text></g><rect y="652" width="1200" height="8" fill="url(#brand)"/></svg>