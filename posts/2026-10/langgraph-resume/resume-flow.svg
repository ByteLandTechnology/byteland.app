<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1100" role="img" aria-labelledby="title"><title id="title">Sequential approval responses and finished work</title><rect width="760" height="1100" rx="24" fill="#f7faff"/><text x="38" y="52" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0064d3">FOLLOW THE ACTIONS</text><text x="38" y="105" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#17253c">One workflow, two approvals</text><rect x="38" y="155" width="684" height="165" rx="18" fill="white" stroke="#007aff" stroke-width="2"/><text x="65" y="200" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#17253c">Both branches pause</text><text x="65" y="252" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#17253c">A waits for an answer.</text><text x="65" y="292" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#17253c">B waits for an answer.</text><path d="M380 329v24m-7-7 7 7 7-7" fill="none" stroke="#6b7f99" stroke-width="3"/><rect x="38" y="360" width="684" height="165" rx="18" fill="white" stroke="#007aff" stroke-width="2"/><text x="65" y="405" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#17253c">Answer A</text><text x="65" y="457" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#17253c">A completes its work.</text><text x="65" y="497" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#17253c">B is still waiting.</text><path d="M380 534v24m-7-7 7 7 7-7" fill="none" stroke="#6b7f99" stroke-width="3"/><rect x="38" y="565" width="684" height="165" rx="18" fill="white" stroke="#34c759" stroke-width="2"/><text x="65" y="610" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#17253c">Answer B</text><text x="65" y="662" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#17253c">Reuse A’s saved result.</text><text x="65" y="702" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#17253c">Continue the unfinished work.</text><path d="M380 739v24m-7-7 7 7 7-7" fill="none" stroke="#6b7f99" stroke-width="3"/><rect x="38" y="770" width="684" height="165" rx="18" fill="white" stroke="#ff3b30" stroke-width="2"/><text x="65" y="815" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#17253c">Verify the history</text><text x="65" y="867" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#17253c">Check the returned state</text><text x="65" y="907" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#17253c">and how often actions ran.</text><text x="38" y="1016" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#435671">An interrupted node can still</text><text x="38" y="1056" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#435671">restart from its beginning.</text></svg>