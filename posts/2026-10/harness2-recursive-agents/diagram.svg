<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1540" role="img" aria-labelledby="title desc"><title id="title">Harness²: two levels of agent refinement</title><desc id="desc">Method diagram. Model weights remain fixed. For the current task, propose harness edits, probe them by execution on the same task, and compose a refinement from behavioral differences. Repeat within a task if the budget permits. Across tasks, retain adopted harnesses and recorded lessons in an improvement harness to guide the next task. Stored lessons require scrutiny; this is not guaranteed verified knowledge or model training.</desc><defs><linearGradient id="theme"><stop stop-color="#007aff"/><stop offset=".5" stop-color="#34c759"/><stop offset="1" stop-color="#ff3b30"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#586579" stroke-width="1.5"/></marker></defs><rect width="640" height="1540" rx="24" fill="#f7f9fc"/><text x="32" y="54" font-size="32" fill="#172033" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">Harness²: two levels</text><text x="32" y="97" font-size="32" fill="#172033" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">of agent refinement</text><rect x="64" y="137" width="544" height="112" rx="18" fill="#eef2f7" stroke="#aebbcf" stroke-width="2"/><text x="90" y="181" font-size="27" fill="#172033" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">MODEL WEIGHTS: FIXED</text><text x="90" y="223" font-size="23" fill="#586579" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Change the system around the model.</text><rect x="64" y="285" width="544" height="728" rx="18" fill="#f0faf3" stroke="#34c759" stroke-width="2"/><text x="88" y="326" font-size="27" fill="#208235" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">1 · Within the current task</text><rect x="96" y="353" width="448" height="88" rx="18" fill="white" stroke="#007aff" stroke-width="2"/><text x="120" y="391" font-size="25" fill="#172033" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">Task + execution harness</text><text x="120" y="423" font-size="21" fill="#586579" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Prompts, tools, memory, workflow</text><path d="M320 441V476" fill="none" stroke="#586579" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="96" y="494" width="448" height="89" rx="18" fill="white" stroke="#007aff" stroke-width="2"/><text x="120" y="533" font-size="27" fill="#0062cc" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">PROPOSE</text><text x="120" y="566" font-size="23" fill="#172033" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Candidate harness edits</text><path d="M320 583V618" fill="none" stroke="#586579" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="96" y="636" width="448" height="101" rx="18" fill="white" stroke="#007aff" stroke-width="2"/><text x="120" y="676" font-size="27" fill="#0062cc" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">PROBE</text><text x="120" y="714" font-size="22" fill="#172033" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Execute candidates on the same task</text><path d="M320 737V772" fill="none" stroke="#586579" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="96" y="790" width="448" height="112" rx="18" fill="white" stroke="#007aff" stroke-width="2"/><text x="120" y="831" font-size="27" fill="#0062cc" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">COMPOSE</text><text x="120" y="870" font-size="22" fill="#172033" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Refine from execution differences</text><path d="M544 846H578V538H554" fill="none" stroke="#208235" stroke-width="2.5" marker-end="url(#arrow)"/><text x="96" y="963" font-size="23" fill="#208235" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Repeat within the task budget.</text><path d="M512 902V1042" fill="none" stroke="#586579" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="64" y="1060" width="544" height="215" rx="18" fill="#edf4ff" stroke="#007aff" stroke-width="2"/><text x="88" y="1103" font-size="27" fill="#0062cc" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">2 · Across tasks</text><text x="88" y="1150" font-size="26" fill="#172033" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">Adopted harnesses</text><text x="88" y="1193" font-size="26" fill="#172033" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">+ recorded lessons</text><text x="88" y="1237" font-size="23" fill="#586579" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Persistent improvement harness</text><path d="M320 1275V1310" fill="none" stroke="#586579" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="96" y="1328" width="448" height="100" rx="18" fill="white" stroke="#007aff" stroke-width="2"/><text x="120" y="1370" font-size="27" fill="#172033" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif">Future task</text><text x="120" y="1410" font-size="22" fill="#586579" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Use earlier experience as context</text><path d="M96 1378H32V397H80" fill="none" stroke="#0062cc" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="1480" font-size="22" fill="#586579" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Method illustration. Recorded lessons need review.</text><text x="32" y="1514" font-size="22" fill="#586579" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">No model training is depicted.</text><rect y="1534" width="640" height="6" fill="url(#theme)"/></svg>