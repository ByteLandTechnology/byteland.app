<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="562.5" viewBox="0 0 1000 562.5" role="img" aria-labelledby="t d"><title id="t">GitHub AI security: separate the controls</title><desc id="d">A light cover showing advisory pull-request review, a default-branch repair loop, and workflow dependency lockfiles as three distinct controls.</desc><style>text{font-family:DejaVu Sans,sans-serif;fill:#172033}.sub{fill:#526174}.label{font-size:30px;font-weight:700}.small{font-size:23px}.flow{stroke-dasharray:10 9;animation:none}@keyframes flow{to{stroke-dashoffset:-38}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><rect width="1000" height="562.5" rx="24" fill="#f6f9fc"/><rect x="48" y="42" width="11" height="48" rx="5" fill="#007aff"/><rect x="67" y="42" width="11" height="48" rx="5" fill="#34c759"/><rect x="86" y="42" width="11" height="48" rx="5" fill="#ff3b30"/><text x="120" y="77" class="small sub">BYTELAND / ENGINEERING NOTES</text>
<text x="48" y="173" font-size="52" font-weight="700">GitHub AI security</text><text x="48" y="233" font-size="39">Separate the controls.</text><text x="48" y="283" class="small sub">Detection, repair and workflow dependencies.</text>
