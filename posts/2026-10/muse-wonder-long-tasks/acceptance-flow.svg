<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><defs><linearGradient id="brand"><stop stop-color="#007aff"/><stop offset=".5" stop-color="#34c759"/><stop offset="1" stop-color="#ff3b30"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="#f7f9fc"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#172033"><title id="title">A long task needs several checks</title><desc id="desc">A task starts with a fixed input and allowed files. The agent produces work. Deterministic checks examine the latest requirement, tests, scope and limits. Animation is decorative and stops for reduced motion.</desc><style>@media(prefers-reduced-motion:reduce){.dot{animation:none}}@keyframes move{0%{transform:translateX(0)}100%{transform:translateX(900px)}}.dot{animation:move 8s linear infinite}</style><text x="60" y="83" font-size="36" font-weight="700">Do the final checks agree?</text><text x="60" y="130" font-size="23" fill="#5c687b">A successful tool call does not prove that the task is complete.</text><path d="M125 260H1080" stroke="#d0dae7" stroke-width="7"/><circle class="dot" cx="125" cy="260" r="11" fill="#007aff"/>
<rect x="60" y="195" width="300" height="135" rx="20" fill="white" stroke="#007aff" stroke-width="3"/><text x="84" y="248" font-size="30" font-weight="700" fill="#0062cc">Fixed task</text><text x="84" y="291" font-size="20">Input + permissions</text><rect x="450" y="195" width="300" height="135" rx="20" fill="white" stroke="#34c759" stroke-width="3"/><text x="474" y="248" font-size="30" font-weight="700" fill="#208235">Agent work</text><text x="474" y="291" font-size="20">Model + tools</text><rect x="840" y="195" width="300" height="135" rx="20" fill="white" stroke="#ff3b30" stroke-width="3"/><text x="864" y="248" font-size="30" font-weight="700" fill="#c52b24">Evidence</text><text x="864" y="291" font-size="20">Tests + recorded changes</text><rect x="60" y="393" width="500" height="78" rx="16" fill="#edf2f8"/><text x="85" y="442" font-size="26">Latest requirement</text><rect x="640" y="393" width="500" height="78" rx="16" fill="#edf2f8"/><text x="665" y="442" font-size="26">Passing test results</text><rect x="60" y="499" width="500" height="78" rx="16" fill="#edf2f8"/><text x="85" y="548" font-size="26">Only permitted files</text><rect x="640" y="499" width="500" height="78" rx="16" fill="#edf2f8"/><text x="665" y="548" font-size="26">Time and cost limits</text><text x="60" y="631" font-size="21" fill="#5c687b">Interpret scores in context. Verify the complete application before deployment.</text></g><rect y="665" width="1200" height="10" fill="url(#brand)"/></svg>